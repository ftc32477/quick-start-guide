name: Check dist in sync

on:
  push:
    branches: [ main, dev ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quick-start-guide
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild HTML
        run: python3 build.py >/dev/null

      - name: Verify dist is in sync
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ 与源码不同步：请本地运行 python3 build.py 并提交生成产物后再推送。"
            exit 1
          fi
          echo "dist/ 与源码同步。"
