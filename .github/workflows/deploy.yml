name: Deploy docs to GitHub Pages

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

# 防止 main/dev 相继推送触发相互竞争的同步
concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quick-start-guide
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild HTML
        run: python3 build.py

      - name: Verify dist is in sync
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ 与源码不同步：请本地运行 python3 build.py 并提交生成产物后再推送。"
            exit 1
          fi
          echo "dist/ 与源码同步。"

      - name: Ensure no PDFs are committed
        run: |
          if [ -d dist/pdf ]; then
            echo "::error::dist/pdf/ 不应进入仓库：请从 dist/ 中移除 PDF 产物。"
            ls -la dist/pdf | head
            exit 1
          fi
          echo "dist/ 中无 PDF 产物。"

      - name: Checkout pages repo
        uses: actions/checkout@v4
        with:
          repository: ftc32477/ftc32477.github.io
          token: ${{ secrets.PAGES_TOKEN }}
          path: pages-repo

      - name: Determine target directory
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "target=docs/dev" >> "$GITHUB_OUTPUT"
          else
            echo "target=docs" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync dist to docs
        run: |
          if [ "${{ steps.target.outputs.target }}" = "docs" ]; then
            # 正式站点整体重建，但保留 docs/dev 开发预览目录
            mkdir -p pages-repo/docs
            find pages-repo/docs -mindepth 1 -maxdepth 1 ! -name dev -exec rm -rf {} +
          else
            rm -rf "pages-repo/${{ steps.target.outputs.target }}"
            mkdir -p "pages-repo/${{ steps.target.outputs.target }}"
          fi
          cp -R dist/. "pages-repo/${{ steps.target.outputs.target }}/"

      - name: Commit and push
        run: |
          cd pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Auto-sync docs from quick-start-guide [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (concurrent sync?), pulling with rebase and retrying..."
              git pull --rebase
              sleep 5
            done
            echo "Push failed after retries."
            exit 1
          fi
