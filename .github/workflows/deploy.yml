name: Deploy docs to GitHub Pages

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quick-start-guide
        uses: actions/checkout@v4

      - name: Checkout pages repo
        uses: actions/checkout@v4
        with:
          repository: ftc32477/ftc32477.github.io
          token: ${{ secrets.PAGES_TOKEN }}
          path: pages-repo

      - name: Determine target directory
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "target=docs/dev" >> "$GITHUB_OUTPUT"
          else
            echo "target=docs" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync dist to docs
        run: |
          rm -rf "pages-repo/${{ steps.target.outputs.target }}"
          mkdir -p "pages-repo/${{ steps.target.outputs.target }}"
          cp -R dist/. "pages-repo/${{ steps.target.outputs.target }}/"

      - name: Commit and push
        run: |
          cd pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Auto-sync docs from quick-start-guide [skip ci]"
            git push
          fi
